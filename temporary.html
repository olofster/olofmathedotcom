<script>
const filterGroup=document.querySelector('.filters');
filterGroup.setAttribute('role','radiogroup');
filterGroup.setAttribute('aria-label','Show Other projects by category');
const filterLabel=document.createElement('span');
filterLabel.className='filter-label';filterLabel.textContent='Show:';filterLabel.setAttribute('aria-hidden','true');filterGroup.prepend(filterLabel);
const filterButtons=Array.from(filterGroup.querySelectorAll('button'));
filterButtons.forEach((button,i)=>{button.setAttribute('role','radio');button.setAttribute('aria-checked',String(i===0));button.removeAttribute('aria-pressed');button.tabIndex=i===0?0:-1;});
filterGroup.addEventListener('keydown',event=>{
  const index=filterButtons.indexOf(document.activeElement);if(index<0)return;
  const directions={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};
  let next;if(event.key in directions)next=(index+directions[event.key]+filterButtons.length)%filterButtons.length;
  else if(event.key==='Home')next=0;else if(event.key==='End')next=filterButtons.length-1;else return;
  event.preventDefault();filterButtons[next].focus();filterButtons[next].click();
});
